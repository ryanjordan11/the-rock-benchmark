<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--text:#171717;--muted:#777;--line:#dedede;--accent:#111}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:68px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}h1{font-size:20px;margin:0;font-weight:600}.header-actions,.actions,.sheet-actions{display:flex;align-items:center;gap:8px}.count{font-size:13px;color:var(--muted);margin-right:5px}
button,select{border:1px solid #cfcfcf;background:#fff;color:var(--text);border-radius:6px;padding:9px 13px;font-size:14px;cursor:pointer}button:hover,select:hover{background:#f0f0f0}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.danger{color:#b42318;border-color:#e3aaa5}.view-toggle{display:flex;border:1px solid #cfcfcf;border-radius:6px;overflow:hidden}.view-toggle button{border:0;border-radius:0;padding:8px 11px}.view-toggle button+button{border-left:1px solid #cfcfcf}.view-toggle button.active{background:#111;color:#fff}
.workspace{min-height:0;flex:1;display:grid;grid-template-columns:1fr 1fr}.workspace.full{grid-template-columns:1fr}.workspace.full .notes-pane{display:none}.workspace.full .editor-pane{background:var(--bg)}.notes-pane{min-width:0;overflow:auto;padding:28px;border-right:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;align-content:start}.note-card{height:180px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px;display:flex;flex-direction:column;cursor:pointer}.note-card:hover{box-shadow:0 7px 20px #0001;transform:translateY(-2px)}.note-card.active{border:2px solid var(--accent);padding:16px}.note-card h3{margin:0 0 9px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-type{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}.preview{color:#555;line-height:1.5;font-size:14px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.date{margin-top:auto;color:#999;font-size:11px}.empty{text-align:center;color:var(--muted);padding:70px 20px}
.editor-pane{min-width:0;background:#fff;display:flex;flex-direction:column}.editor-top{height:68px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px}.title{flex:1;min-width:0;border:0;outline:0;font-size:22px;font-weight:600}.type{width:130px}.editor-body{min-height:0;flex:1;padding:24px 20px;display:flex}.body{width:100%;height:100%;resize:none;border:0;outline:0;font:16px/1.6 Arial,sans-serif}.sheet-wrap{width:100%;height:100%;overflow:auto}.sheet-tools{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--muted);font-size:12px}.sheet{border-collapse:collapse;width:100%;min-width:620px;background:#fff}.sheet th,.sheet td{border:1px solid #d7d7d7;height:40px;padding:0}.sheet th{background:#f1f1f1}.sheet input{width:100%;height:39px;border:0;outline:0;background:transparent;padding:8px 10px;font:14px Arial}.sheet th input{font-weight:600;text-align:center}.sheet td:first-child{width:42px;text-align:center;color:#888;background:#fafafa}.footer{height:62px;flex:none;border-top:1px solid var(--line);padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.status{font-size:12px;color:#666}.full .editor-pane{overflow:auto}.full .editor-top{padding:0 max(24px,calc((100% - 760px)/2));background:#fff}.full .title{max-width:680px;margin:auto;font-size:28px}.full .editor-body{display:block;padding:42px 24px 70px}.full .body{display:block;width:min(760px,100%);min-height:calc(100vh - 220px);margin:auto;padding:48px 64px;background:#fff;border:1px solid #e4e4e4;box-shadow:0 2px 8px #0001;font:17px/1.75 Georgia,serif}.full .sheet-wrap{width:min(1100px,100%);height:auto;min-height:calc(100vh - 250px);margin:auto;padding:28px;background:#fff;border:1px solid #e4e4e4;box-shadow:0 2px 8px #0001}.full .footer{background:#fff;padding:0 max(24px,calc((100% - 760px)/2))}
@media(max-width:760px){header{padding:0 16px}.workspace{grid-template-columns:1fr}.notes-pane{height:43vh;padding:16px;border-right:0;border-bottom:1px solid var(--line)}.editor-pane{height:57vh}.workspace.full .notes-pane{display:none}.workspace.full .editor-pane{height:100%}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.note-card{height:145px;padding:13px}.note-card.active{padding:12px}.count{display:none}.editor-top{height:58px;padding:0 14px}.type{width:105px}.editor-body{padding:16px 14px}.footer{height:auto;min-height:58px;padding:8px 14px}.full .editor-top{height:62px;padding:0 14px}.full .title{font-size:22px}.full .editor-body{padding:18px 0 30px}.full .body{width:100%;min-height:calc(100vh - 190px);padding:30px 22px;border-left:0;border-right:0;box-shadow:none}.full .sheet-wrap{width:100%;min-height:calc(100vh - 190px);padding:16px;border-left:0;border-right:0;box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<header><h1>Notes</h1><div class="header-actions"><span class="count" id="count">0 notes</span><div class="view-toggle"><button id="split" class="active">Side panel</button><button id="full">Full screen</button></div><button class="primary" id="add">＋ Add note</button></div></header>
<main class="workspace" id="workspace"><section class="notes-pane"><div class="grid" id="grid"></div></section><section class="editor-pane"><div class="editor-top"><input class="title" id="title" placeholder="Note name"><select class="type" id="type"><option value="document">Document</option><option value="sheet">Spreadsheet</option></select><button id="close">✕</button></div><div class="editor-body" id="editor"></div><div class="footer"><span class="status" id="status">Select a note</span><div class="actions"><button id="import">Import CSV</button><button id="download">Download</button><button class="danger" id="delete">Delete</button><button class="primary" id="save">Save note</button></div></div></section></main>
</div>
<input type="file" id="csvFile" accept=".csv,text/csv" hidden>
<script>
const KEY='notes-dashboard-v1';let notes=[],active=null,isNew=false,draft=null;const $=id=>document.getElementById(id);const workspace=$('workspace');
function normalize(n){n.type=n.type||'document';if(n.type==='sheet'){n.headers=Array.isArray(n.headers)&&n.headers.length?n.headers:['Column 1','Column 2','Column 3','Column 4'];n.rows=Array.isArray(n.rows)&&n.rows.length?n.rows:[Array(n.headers.length).fill('')];n.rows=n.rows.map(row=>{row=Array.isArray(row)?row:[];while(row.length<n.headers.length)row.push('');return row.slice(0,n.headers.length)})}}
function load(){try{notes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){notes=[]}if(!Array.isArray(notes))notes=[];notes.forEach(normalize);if(notes[0])active=notes[0].id;render()}
function persist(){localStorage.setItem(KEY,JSON.stringify(notes))}function current(){return isNew?draft:notes.find(n=>n.id===active)}
function render(){$('count').textContent=`${notes.length} note${notes.length===1?'':'s'}`;if(!notes.length&&!isNew){$('grid').innerHTML='<div class="empty">No notes yet.<br>Click “Add note” to create one.</div>';clearEditor();return}renderCards();if(current())show(current())}
function renderCards(){$('grid').innerHTML=notes.map(n=>`<article class="note-card ${n.id===active?'active':''}" data-id="${n.id}"><h3>${esc(n.title||'Untitled note')}</h3><div class="note-type">${n.type==='sheet'?'Spreadsheet':'Document'}</div><div class="preview">${esc(n.type==='sheet'?sheetPreview(n):n.body||'No text yet')}</div><div class="date">${date(n.updated)}</div></article>`).join('');document.querySelectorAll('.note-card').forEach(c=>c.onclick=()=>open(c.dataset.id))}
function sheetPreview(n){return(n.rows||[]).slice(0,4).map(r=>r.filter(Boolean).join(' · ')).filter(Boolean).join('\n')||'Empty sheet'}
function add(){let now=Date.now();active=crypto.randomUUID();isNew=true;draft={id:active,title:'',type:'document',body:'',headers:['Column 1','Column 2','Column 3','Column 4'],rows:[['','','','']],created:now,updated:now};$('status').textContent='Not saved yet';renderCards();show(draft);$('title').focus()}
function open(id){active=id;isNew=false;show(current());renderCards()}
function show(n){$('title').value=n.title||'';$('type').value=n.type||'document';renderEditor();$('status').textContent=isNew?'Not saved yet':'Saved locally'}
function renderEditor(){let n=current();if(!n)return;if($('type').value==='sheet')renderSheet(n);else{$('editor').innerHTML='<textarea class="body" id="body" placeholder="Write your note here..."></textarea>';$('body').value=n.body||''}}
function renderSheet(n){let h=n.headers,r=n.rows;$('editor').innerHTML=`<div class="sheet-wrap"><div class="sheet-tools"><span>Paste one item per line to create rows · Up to 10 columns</span><div class="sheet-actions"><button id="addCol">＋ Column</button><button id="removeCol">− Column</button><button id="addRow">＋ Row</button></div></div><table class="sheet"><thead><tr><th>#</th>${h.map((x,i)=>`<th><input data-head="${i}" value="${attr(x)}"></th>`).join('')}</tr></thead><tbody>${r.map((row,ri)=>`<tr><td>${ri+1}</td>${h.map((_,ci)=>`<td><input data-cell="${ri},${ci}" value="${attr(row[ci]||'')}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;$('editor').querySelectorAll('[data-head]').forEach(x=>x.oninput=()=>{n.headers[+x.dataset.head]=x.value;changed()});$('editor').querySelectorAll('[data-cell]').forEach(x=>x.oninput=()=>{let[ri,ci]=x.dataset.cell.split(',').map(Number);n.rows[ri][ci]=x.value;changed()});$('editor').querySelector('.sheet-wrap').addEventListener('paste',e=>handleSheetPaste(e,n));$('addRow').onclick=()=>{n.rows.push(Array(n.headers.length).fill(''));renderSheet(n);changed()};$('addCol').onclick=()=>{if(n.headers.length>=10)return;n.headers.push('Column '+n.headers.length);n.rows.forEach(row=>row.push(''));renderSheet(n);changed()};$('removeCol').onclick=()=>{if(n.headers.length<=1)return;n.headers.pop();n.rows.forEach(row=>row.pop());renderSheet(n);changed()}}
function handleSheetPaste(event,n){let input=event.target.closest('[data-cell]');if(!input)return;let raw=event.clipboardData?.getData('text/plain')||'';if(!raw)return;let normalized=raw.replace(/\r\n/g,'\n').replace(/\r/g,'\n');let lines=normalized.split('\n');if(lines.length&&lines[lines.length-1]==='')lines.pop();if(lines.length<2&&!/^\s*(?:\d+[.)]|[-*•])\s+/.test(normalized))return;event.preventDefault();let[startRow,startCol]=input.dataset.cell.split(',').map(Number);let parsed=lines.filter(line=>line.trim()!=='').map(line=>{let cleaned=line.replace(/^\s*(?:\d+[.)]|[-*•])\s+/,'');return/\t/.test(cleaned)?cleaned.split('\t').map(v=>v.trim()):cleaned.split(',').map(v=>v.trim())});parsed.forEach((parts,rowOffset)=>{let rowIndex=startRow+rowOffset;while(!n.rows[rowIndex])n.rows.push(Array(n.headers.length).fill(''));parts.slice(0,n.headers.length-startCol).forEach((value,colOffset)=>{n.rows[rowIndex][startCol+colOffset]=value})});renderSheet(n);changed();document.querySelector(`[data-cell="${startRow},${startCol}"]`)?.focus()}
function changed(){$('status').textContent='Unsaved changes'}
function save(){let n=current();if(!n)return;n.title=$('title').value.trim()||'Untitled note';n.type=$('type').value;if(n.type==='document')n.body=$('body')?.value||'';n.updated=Date.now();if(isNew){notes.unshift(n);isNew=false;draft=null}persist();$('status').textContent='Saved locally';render()}
function importCSV(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let rows=parseCSV(String(reader.result||''));if(!rows.length)throw new Error('empty');let width=Math.min(10,Math.max(1,...rows.map(r=>r.length)));rows=rows.map(r=>{let x=r.slice(0,width);while(x.length<width)x.push('');return x});let first=rows[0],looksLikeHeader=first.some(v=>/[a-zA-Z]/.test(v))||first.every(v=>!/^\d+(?:\.\d+)?$/.test(v));let headers=looksLikeHeader?first.map((v,i)=>v||'Column '+(i+1)):Array.from({length:width},(_,i)=>'Column '+(i+1));let data=looksLikeHeader?rows.slice(1):rows;while(!data.length)data.push(Array(width).fill(''));let now=Date.now();active=crypto.randomUUID();isNew=true;draft={id:active,title:file.name.replace(/\.csv$/i,'')||'Imported CSV',type:'sheet',body:'',headers,rows:data,created:now,updated:now};show(draft);renderCards();$('status').textContent='CSV loaded — save to keep it';$('type').value='sheet';$('title').focus()}catch(e){alert('Could not read that CSV file.')}};reader.readAsText(file)}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i],next=text[i+1];if(ch==='"'){if(quoted&&next==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row);row=[];cell=''}else cell+=ch}if(cell!==''||row.length){row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row)}return rows}
function download(){let n=current();if(!n)return;let name=$('title').value.trim()||'Untitled note',text,ext;if(n.type==='sheet'){text=[n.headers,...n.rows].map(row=>row.map(csv).join(',')).join('\n');ext='csv'}else{text=name+'\n\n'+($('body')?.value||'');ext='txt'}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=safe(name)+'.'+ext;a.click();$('status').textContent='Downloaded'}
function csv(v){let s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}function del(){if(isNew){clearEditor();renderCards();return}if(!active||!confirm('Delete this note?'))return;notes=notes.filter(n=>n.id!==active);active=notes[0]?.id||null;persist();render()}function clearEditor(){active=null;isNew=false;draft=null;$('title').value='';$('editor').innerHTML='';$('status').textContent='Select a note'}function setView(full){workspace.classList.toggle('full',full);$('split').classList.toggle('active',!full);$('full').classList.toggle('active',full)}function closeEditor(){clearEditor();document.querySelectorAll('.note-card').forEach(c=>c.classList.remove('active'))}function date(t){return new Date(t||Date.now()).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}function safe(s){return s.replace(/[\\/:*?"<>|]/g,'-').trim()||'note'}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function attr(v){return esc(v)}
$('add').onclick=add;$('save').onclick=save;$('download').onclick=download;$('delete').onclick=del;$('close').onclick=closeEditor;$('split').onclick=()=>setView(false);$('full').onclick=()=>setView(true);$('import').onclick=()=>{if(current()&&current().type==='sheet')$('csvFile').click();else $('csvFile').click()};$('csvFile').onchange=e=>{importCSV(e.target.files[0]);e.target.value=''};$('type').onchange=()=>{let n=current();if(n){n.type=$('type').value;normalize(n);renderEditor();changed()}};load();
</script>
</body>
</html>
